apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.app.name }}-migrations-job"
  labels:
    app: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrations
        image: "{{ .Values.migrations.image.repository }}:{{ default .Chart.AppVersion .Values.migrations.image.tag }}"
        command: ["migrate"]
        imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
        env:
{{ toYaml .Values.env | indent 8 }}
