apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-worker
  labels:
    app: {{ .Values.app.name }}-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-worker
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-worker
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Values.app.name }}-worker
          image: "{{ .Values.worker.image.repository }}:{{ default .Chart.AppVersion .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["/worker"]
          env:
{{ toYaml .Values.env | indent 12 }}
