apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.app.name }}
  name: {{ .Values.app.name }}
spec:
  ports:
  - name: http
    port: {{ .Values.app.service.port }}
    protocol: TCP
    targetPort: {{ .Values.app.service.port }}
  selector:
    app: {{ .Values.app.name }}
  sessionAffinity: None
  type: ClusterIP
