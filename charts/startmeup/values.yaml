app:
  name: startmeup
  service:
    port: 8000
  image:
    repository: ghcr.io/edkadigital/startmeup-app
    tag: ""
    pullPolicy: IfNotPresent

ingress:
  clusterIssuer: letsencrypt-http
  host: app.startmeup.dev

api:
  port: 8888
  image:
    repository: ghcr.io/edkadigital/startmeup-api
    tag: ""
    pullPolicy: IfNotPresent
  service:
    enabled: true
    name: ""
    port: 8888
    type: ClusterIP
  ingress:
    enabled: true
    clusterIssuer: ""
    host: api.startmeup.dev
    path: /
    pathType: Prefix
    tls:
      enabled: true
      secretName: ""

worker:
  image:
    repository: ghcr.io/edkadigital/startmeup-worker
    tag: ""
    pullPolicy: IfNotPresent

migrations:
  image:
    repository: ghcr.io/edkadigital/startmeup-migrations
    tag: ""
    pullPolicy: IfNotPresent

replicaCount:
  app: 2
  worker: 2

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 50Mi

env:
  - name: ENV
    value: production
  # sensitive values
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: startmeup
        key: DATABASE_URL
  
